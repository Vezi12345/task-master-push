<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Master — AI Job Agent</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22262f;
    --border: #2e3340;
    --text: #e4e6eb;
    --muted: #8b8f9a;
    --accent: #6c8cff;
    --accent-dim: #3a4f8a;
    --green: #4ade80;
    --yellow: #facc15;
    --red: #f87171;
    --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.5;
  }
  .container { max-width: 860px; margin: 0 auto; padding: 24px 20px; }

  header {
    text-align: center;
    padding: 40px 0 32px;
  }
  header h1 {
    font-size: 1.8rem;
    font-weight: 700;
    letter-spacing: -0.5px;
  }
  header h1 span { color: var(--accent); }
  header p {
    color: var(--muted);
    margin-top: 6px;
    font-size: 0.95rem;
  }

  .search-box {
    display: flex;
    gap: 10px;
    margin-bottom: 12px;
  }
  .search-box input {
    flex: 1;
    padding: 14px 18px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 1rem;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-box input:focus { border-color: var(--accent); }
  .search-box input::placeholder { color: var(--muted); }
  .search-box button {
    padding: 14px 28px;
    border-radius: var(--radius);
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
    white-space: nowrap;
  }
  .search-box button:hover { background: #5a7aee; }
  .search-box button:disabled { opacity: 0.5; cursor: not-allowed; }

  .examples {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 28px;
  }
  .examples button {
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    font-size: 0.82rem;
    cursor: pointer;
    transition: all 0.2s;
  }
  .examples button:hover {
    border-color: var(--accent);
    color: var(--text);
  }

  .loading {
    text-align: center;
    padding: 48px 0;
    color: var(--muted);
    display: none;
  }
  .loading.active { display: block; }
  .spinner {
    width: 32px; height: 32px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin: 0 auto 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .results { display: none; }
  .results.active { display: block; }

  .intent-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 20px;
  }
  .intent-card h3 {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    margin-bottom: 12px;
  }
  .intent-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 12px;
  }
  .intent-field label {
    display: block;
    font-size: 0.75rem;
    color: var(--muted);
    margin-bottom: 2px;
  }
  .intent-field .value {
    font-size: 0.92rem;
    font-weight: 500;
  }
  .intent-field .value.empty { color: var(--muted); font-style: italic; }

  .stats {
    display: flex;
    gap: 16px;
    margin-bottom: 20px;
    font-size: 0.88rem;
    color: var(--muted);
  }
  .stats span { color: var(--text); font-weight: 600; }

  .messages {
    margin-bottom: 20px;
    font-size: 0.82rem;
    color: var(--muted);
  }
  .messages div { padding: 2px 0; }

  .job-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 12px;
    transition: border-color 0.2s;
  }
  .job-card:hover { border-color: var(--accent-dim); }

  .job-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    margin-bottom: 10px;
  }
  .job-title {
    font-size: 1.05rem;
    font-weight: 600;
  }
  .job-title a {
    color: var(--text);
    text-decoration: none;
  }
  .job-title a:hover { color: var(--accent); }
  .job-company {
    font-size: 0.9rem;
    color: var(--muted);
    margin-top: 2px;
  }
  .score-badge {
    flex-shrink: 0;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.9rem;
    font-weight: 700;
    border: 3px solid;
  }
  .score-high { border-color: var(--green); color: var(--green); }
  .score-mid  { border-color: var(--yellow); color: var(--yellow); }
  .score-low  { border-color: var(--red); color: var(--red); }

  .job-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .job-meta .tag {
    padding: 2px 10px;
    border-radius: 14px;
    background: var(--surface2);
    font-size: 0.8rem;
  }
  .tag-remote { background: #1a3a2a; color: var(--green); }
  .tag-onsite { background: #3a2a1a; color: var(--yellow); }

  .job-summary {
    font-size: 0.9rem;
    color: var(--muted);
    margin-bottom: 10px;
    font-style: italic;
  }

  .job-reasons {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 4px 16px;
    font-size: 0.82rem;
    color: var(--muted);
    margin-bottom: 12px;
  }
  .job-reasons div { white-space: nowrap; }

  .keep-btn {
    padding: 6px 16px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-size: 0.82rem;
    cursor: pointer;
    transition: all 0.2s;
  }
  .keep-btn:hover { border-color: var(--accent); color: var(--accent); }
  .keep-btn.kept { border-color: var(--green); color: var(--green); pointer-events: none; }

  .apply-btn {
    padding: 6px 16px;
    border-radius: 6px;
    border: 1px solid var(--green);
    background: transparent;
    color: var(--green);
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .apply-btn:hover { background: var(--green); color: #000; }
  .apply-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .apply-btn.applied { border-color: var(--muted); color: var(--muted); pointer-events: none; }

  .empty-state {
    text-align: center;
    padding: 48px 0;
    color: var(--muted);
  }
  .empty-state .icon { font-size: 2rem; margin-bottom: 8px; }

  .error-msg {
    background: #2a1a1a;
    border: 1px solid #5a2a2a;
    border-radius: var(--radius);
    padding: 14px 18px;
    margin-bottom: 20px;
    color: var(--red);
    font-size: 0.9rem;
    display: none;
  }
  .error-msg.active { display: block; }

  .cv-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 24px;
  }
  .cv-section h3 {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    margin-bottom: 12px;
  }
  .cv-upload-row {
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .cv-upload-row input[type="file"] {
    flex: 1;
    padding: 10px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    font-size: 0.9rem;
  }
  .cv-upload-row button {
    padding: 10px 20px;
    border-radius: var(--radius);
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .cv-upload-row button:hover { background: #5a7aee; }
  .cv-upload-row button:disabled { opacity: 0.5; cursor: not-allowed; }
  .cv-status {
    margin-top: 10px;
    font-size: 0.85rem;
    color: var(--muted);
    display: none;
  }
  .cv-status.active { display: block; }
  .cv-status.success { color: var(--green); }
  .cv-status.error { color: var(--red); }
  .cv-profile-info {
    margin-top: 12px;
    font-size: 0.88rem;
  }
  .cv-profile-info .label {
    color: var(--muted);
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .cv-profile-info .value {
    color: var(--text);
    font-weight: 500;
    margin-bottom: 6px;
  }
  .cv-skills {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 4px;
  }
  .cv-skills .skill-tag {
    padding: 2px 10px;
    border-radius: 14px;
    background: var(--surface2);
    font-size: 0.8rem;
    color: var(--text);
  }

  .match-section {
    background: #151a24;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    margin-top: 10px;
    margin-bottom: 4px;
  }
  .match-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .match-header .label {
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--muted);
  }
  .match-badge {
    font-size: 0.85rem;
    font-weight: 700;
    padding: 2px 10px;
    border-radius: 12px;
  }
  .match-high { background: #1a3a2a; color: var(--green); }
  .match-mid  { background: #3a3a1a; color: var(--yellow); }
  .match-low  { background: #3a1a1a; color: var(--red); }
  .match-row {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 10px;
    font-size: 0.8rem;
    margin-bottom: 4px;
  }
  .match-row .lbl { color: var(--muted); min-width: 60px; }
  .match-row .val { color: var(--text); }
  .match-skill-tag {
    padding: 1px 8px;
    border-radius: 10px;
    font-size: 0.75rem;
  }
  .match-skill-ok { background: #1a3a2a; color: var(--green); }
  .match-skill-miss { background: #3a2a1a; color: var(--red); }
  .readiness-row {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
    font-size: 0.8rem;
    color: var(--muted);
  }
  .readiness-ready { color: var(--green); font-weight: 600; }
  .readiness-not { color: var(--yellow); font-weight: 600; }

  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 24px;
    border-bottom: 1px solid var(--border);
  }
  .tab-btn {
    padding: 10px 20px;
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .app-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 10px;
  }
  .app-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .app-title { font-size: 0.95rem; font-weight: 600; }
  .app-company { font-size: 0.85rem; color: var(--muted); }
  .status-badge {
    padding: 2px 10px;
    border-radius: 12px;
    font-size: 0.75rem;
    font-weight: 600;
  }
  .status-submitted { background: #1a3a2a; color: var(--green); }
  .status-pending { background: #3a3a1a; color: var(--yellow); }
  .status-awaiting { background: #1a2a3a; color: var(--accent); }
  .status-needs { background: #3a2a1a; color: var(--yellow); }
  .status-failed { background: #3a1a1a; color: var(--red); }
  .status-draft { background: var(--surface2); color: var(--muted); }
  .status-manual { background: #2a1a3a; color: #a78bfa; }
  .app-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    font-size: 0.8rem;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .app-actions {
    display: flex;
    gap: 8px;
    margin-top: 8px;
  }
  .app-actions button {
    padding: 4px 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-size: 0.8rem;
    cursor: pointer;
    transition: all 0.2s;
  }
  .app-actions button:hover { border-color: var(--accent); color: var(--accent); }
  .app-actions .approve-btn:hover { border-color: var(--green); color: var(--green); }
  .app-actions .cancel-btn:hover { border-color: var(--red); color: var(--red); }
  .app-dimensions {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 6px;
    margin-top: 8px;
    font-size: 0.8rem;
  }
  .dim-item {
    display: flex;
    justify-content: space-between;
    padding: 4px 8px;
    background: var(--surface2);
    border-radius: 6px;
  }
  .dim-item .dim-name { color: var(--muted); }
  .dim-item .dim-score { font-weight: 600; }
  .dim-score-high { color: var(--green); }
  .dim-score-mid { color: var(--yellow); }
  .dim-score-low { color: var(--red); }

  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.7);
    z-index: 100;
    overflow-y: auto;
    padding: 40px 20px;
  }
  .modal-overlay.active { display: flex; justify-content: center; align-items: flex-start; }
  .modal-content {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px;
    max-width: 700px;
    width: 100%;
    position: relative;
  }
  .modal-close {
    position: absolute;
    top: 16px;
    right: 16px;
    background: none;
    border: none;
    color: var(--muted);
    font-size: 1.4rem;
    cursor: pointer;
  }
  .modal-close:hover { color: var(--text); }
  .modal-section {
    margin-bottom: 20px;
  }
  .modal-section h4 {
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    margin-bottom: 8px;
    padding-bottom: 4px;
    border-bottom: 1px solid var(--border);
  }
  .modal-section pre {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 14px;
    font-size: 0.85rem;
    white-space: pre-wrap;
    word-wrap: break-word;
    color: var(--text);
    line-height: 1.6;
  }
  .modal-qa-item {
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.85rem;
  }
  .modal-qa-item:last-child { border-bottom: none; }
  .modal-qa-q { color: var(--text); font-weight: 500; }
  .modal-qa-a { color: var(--muted); margin-top: 2px; }
  .modal-qa-a.unanswered { color: var(--yellow); font-style: italic; }
  .modal-missing-item {
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.85rem;
  }
  .modal-missing-item:last-child { border-bottom: none; }
  .modal-missing-q { color: var(--yellow); }
  .modal-missing-cat { color: var(--muted); font-size: 0.8rem; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1><span>Task Master</span></h1>
    <p>AI-powered job application agent for South African job seekers</p>
  </header>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('search')">Search & Apply</button>
    <button class="tab-btn" onclick="switchTab('applications')">Applications</button>
  </div>

  <div class="tab-panel active" id="tab-search">

  <div class="cv-section">
    <h3>Your CV</h3>
    <div class="cv-upload-row">
      <input type="file" id="cv-file" accept=".pdf">
      <button id="cv-upload-btn" onclick="uploadCV()">Upload CV</button>
    </div>
    <div class="cv-status" id="cv-status"></div>
    <div class="cv-profile-info" id="cv-profile-info" style="display:none"></div>
  </div>

  <div class="search-box">
    <input type="text" id="query" placeholder="e.g. entry-level software engineer in Durban, preferably remote" autofocus>
    <button id="search-btn" onclick="doSearch()">Search</button>
  </div>

  <div class="examples">
    <button onclick="fillQuery(this)">Recent CS graduate in Durban, entry-level software jobs, remote preferred</button>
    <button onclick="fillQuery(this)">Junior data analyst in Cape Town, at least R20k</button>
    <button onclick="fillQuery(this)">Fully remote Python developer jobs</button>
    <button onclick="fillQuery(this)">Admin clerk jobs in Johannesburg</button>
    <button onclick="fillQuery(this)">Finance graduate jobs, at least R15k per month</button>
  </div>

  <div class="error-msg" id="error"></div>
  <div class="loading" id="loading">
    <div class="spinner"></div>
    Searching and ranking jobs...
  </div>

  <div class="results" id="results">
    <div class="intent-card">
      <h3>What I understood</h3>
      <div class="intent-grid" id="intent-grid"></div>
    </div>

    <div class="stats" id="stats"></div>
    <div class="messages" id="messages"></div>

    <div id="job-list"></div>
    <div class="empty-state" id="empty-state" style="display:none">
      <div class="icon">:(</div>
      <p>No jobs matched your criteria. Try loosening your requirements.</p>
    </div>
  </div>
</div>

  <div class="tab-panel" id="tab-applications">
    <div id="app-list"></div>
    <div class="empty-state" id="app-empty" style="display:none">
      <div class="icon">📋</div>
      <p>No applications yet. Search and apply to jobs to see them here.</p>
    </div>
  </div>
</div>

<div class="modal-overlay" id="detail-modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-content">
    <button class="modal-close" onclick="closeModal()">&times;</button>
    <div id="modal-body"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

$('query').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });

function fillQuery(btn) {
  $('query').value = btn.textContent;
  doSearch();
}

async function doSearch() {
  const q = $('query').value.trim();
  if (!q) return;

  $('error').className = 'error-msg';
  $('results').className = 'results';
  $('loading').className = 'loading active';
  $('search-btn').disabled = true;

  try {
    const resp = await fetch('/api/search', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query: q }),
    });
    const data = await resp.json();
    if (!resp.ok) {
      showError(data.error || 'Search failed');
      return;
    }
    renderResults(data);
  } catch (err) {
    showError('Network error: ' + err.message);
  } finally {
    $('loading').className = 'loading';
    $('search-btn').disabled = false;
  }
}

function showError(msg) {
  $('error').textContent = msg;
  $('error').className = 'error-msg active';
}

function renderResults(data) {
  const q = data.query;
  const grid = $('intent-grid');
  grid.innerHTML = [
    field('Roles', q.roles.length ? q.roles.join(', ') : null),
    field('Seniority', q.seniority || null),
    field('Locations', q.locations.length ? q.locations.map(l => l.city + ' (' + l.radius_km + ' km)').join(', ') : null),
    field('Remote', { any: 'Any', preferred: 'Preferred', required: 'Required', no: 'On-site only' }[q.remote] || q.remote),
    field('Min Salary', q.min_salary ? q.currency + ' ' + q.min_salary.toLocaleString() : null),
    field('Skills', q.skills.length ? q.skills.join(', ') : null),
    field('Keywords', q.keywords.length ? q.keywords.join(', ') : null),
  ].join('');

  $('stats').innerHTML = `<span>${data.jobs_found}</span> jobs found &nbsp;→&nbsp; <span>${data.ranked.length}</span> after filtering`;

  $('messages').innerHTML = data.messages.map(m => `<div>${esc(m)}</div>`).join('');

  const list = $('job-list');
  const empty = $('empty-state');
  if (!data.ranked.length) {
    list.innerHTML = '';
    empty.style.display = '';
    $('results').className = 'results active';
    return;
  }
  empty.style.display = 'none';

  list.innerHTML = data.ranked.map((j, i) => {
    const cls = j.score >= 75 ? 'score-high' : j.score >= 50 ? 'score-mid' : 'score-low';
    const remoteTag = j.remote ? '<span class="tag tag-remote">Remote</span>' : '<span class="tag tag-onsite">On-site</span>';
    const salaryTag = j.salary_min ? `<span class="tag">R${j.salary_min.toLocaleString()}/mo</span>` : j.salary_text ? `<span class="tag">${esc(j.salary_text)}</span>` : '';
    const link = j.url ? `<a href="${esc(j.url)}" target="_blank" rel="noopener">${esc(j.title)}</a>` : esc(j.title);
    const matchHtml = j.candidate_match ? renderCandidateMatch(j.candidate_match, j.readiness) : '';
    const detailedHtml = j.detailed_match ? renderDetailedMatch(j.detailed_match) : '';
    return `
      <div class="job-card">
        <div class="job-header">
          <div>
            <div class="job-title">${link}</div>
            <div class="job-company">${esc(j.company)}</div>
          </div>
          <div class="score-badge ${cls}">${j.score}%</div>
        </div>
        <div class="job-meta">
          <span class="tag">${esc(j.location)}</span>
          ${remoteTag}
          ${salaryTag}
          <span class="tag">${esc(j.source)}</span>
        </div>
        ${j.summary ? `<div class="job-summary">${esc(j.summary)}</div>` : ''}
        <div class="job-reasons">${j.reasons.map(r => `<div>${esc(r)}</div>`).join('')}</div>
        ${matchHtml}
        ${detailedHtml}
        <button class="keep-btn" id="keep-${i}" onclick="keepJob(${i}, this)">Keep this job</button>
        <button class="apply-btn" id="apply-${i}" onclick="applyJob(${i}, this)">Apply</button>
      </div>`;
  }).join('');

  window._ranked = data.ranked;
  $('results').className = 'results active';
}

async function keepJob(idx, btn) {
  const j = window._ranked[idx];
  btn.textContent = 'Keeping...';
  try {
    await fetch('/api/keep', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        title: j.title, company: j.company, location: j.location,
        remote: j.remote, salary_text: j.salary_text, url: j.url, source: j.source,
      }),
    });
    btn.textContent = 'Kept!';
    btn.className = 'keep-btn kept';
  } catch {
    btn.textContent = 'Keep this job';
  }
}

async function applyJob(idx, btn) {
  const j = window._ranked[idx];
  btn.textContent = 'Applying...';
  btn.disabled = true;
  try {
    const resp = await fetch('/api/apply', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        job: {
          id: j.url || j.title + '_' + j.company,
          title: j.title,
          company: j.company,
          location: j.location,
          url: j.url,
          source: j.source,
          description: j.summary || '',
          salary_min: j.salary_min,
          salary_text: j.salary_text,
          remote: j.remote,
          score: j.score,
        },
      }),
    });
    const data = await resp.json();
    if (resp.ok && data.ok) {
      btn.textContent = 'Applied!';
      btn.className = 'apply-btn applied';
    } else {
      btn.textContent = data.error || 'Failed';
      btn.disabled = false;
    }
  } catch (err) {
    btn.textContent = 'Error';
    btn.disabled = false;
  }
}

function field(label, value) {
  return `<div class="intent-field"><label>${label}</label><div class="value ${value ? '' : 'empty'}">${value || 'not specified'}</div></div>`;
}

function renderCandidateMatch(match, readiness) {
  const mcls = match.score >= 70 ? 'match-high' : match.score >= 40 ? 'match-mid' : 'match-low';
  let html = '<div class="match-section">';
  html += '<div class="match-header"><span class="label">Candidate Match</span>';
  html += `<span class="match-badge ${mcls}">${match.score}%</span></div>`;
  if (match.matched_skills && match.matched_skills.length) {
    html += '<div class="match-row"><span class="lbl">Matched:</span><span class="val">';
    html += match.matched_skills.map(s => `<span class="match-skill-tag match-skill-ok">${esc(s)}</span>`).join(' ');
    html += '</span></div>';
  }
  if (match.missing_skills && match.missing_skills.length) {
    html += '<div class="match-row"><span class="lbl">Missing:</span><span class="val">';
    html += match.missing_skills.map(s => `<span class="match-skill-tag match-skill-miss">${esc(s)}</span>`).join(' ');
    html += '</span></div>';
  }
  if (match.strengths && match.strengths.length) {
    html += '<div class="match-row"><span class="lbl">Strengths:</span><span class="val">';
    html += match.strengths.map(s => esc(s)).join(' &middot; ');
    html += '</span></div>';
  }
  if (match.concerns && match.concerns.length) {
    html += '<div class="match-row"><span class="lbl">Gaps:</span><span class="val">';
    html += match.concerns.map(s => esc(s)).join(' &middot; ');
    html += '</span></div>';
  }
  if (readiness) {
    const rcls = readiness.ready ? 'readiness-ready' : 'readiness-not';
    const rtext = readiness.ready ? 'Ready to apply' : 'Not ready yet';
    html += `<div class="readiness-row"><span class="${rcls}">${rtext}</span>`;
    if (readiness.warnings && readiness.warnings.length) {
      html += ' — ' + readiness.warnings.map(w => esc(w)).join('; ');
    }
    if (readiness.blockers && readiness.blockers.length) {
      html += ' — ' + readiness.blockers.map(b => esc(b)).join('; ');
    }
    html += '</div>';
  }
  html += '</div>';
  return html;
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

async function uploadCV() {
  const fileInput = $('cv-file');
  const file = fileInput.files[0];
  if (!file) {
    showCvStatus('Please select a PDF file.', 'error');
    return;
  }
  if (!file.name.toLowerCase().endsWith('.pdf')) {
    showCvStatus('Only PDF files are supported.', 'error');
    return;
  }

  $('cv-upload-btn').disabled = true;
  showCvStatus('Uploading and parsing CV...', '');

  const formData = new FormData();
  formData.append('cv', file);

  try {
    const resp = await fetch('/api/upload-cv', {
      method: 'POST',
      body: formData,
    });
    const data = await resp.json();
    if (!resp.ok) {
      showCvStatus(data.error || 'Upload failed', 'error');
      return;
    }
    showCvStatus('CV uploaded successfully', 'success');
    renderCvProfile(data.profile);
  } catch (err) {
    showCvStatus('Network error: ' + err.message, 'error');
  } finally {
    $('cv-upload-btn').disabled = false;
  }
}

function showCvStatus(msg, cls) {
  const el = $('cv-status');
  el.textContent = msg;
  el.className = 'cv-status active' + (cls ? ' ' + cls : '');
}

function renderCvProfile(profile) {
  const el = $('cv-profile-info');
  if (!profile) { el.style.display = 'none'; return; }
  let html = '';
  if (profile.name) html += `<div class="label">Name</div><div class="value">${esc(profile.name)}</div>`;
  if (profile.email) html += `<div class="label">Email</div><div class="value">${esc(profile.email)}</div>`;
  if (profile.location) html += `<div class="label">Location</div><div class="value">${esc(profile.location)}</div>`;
  if (profile.education && profile.education.length) {
    const edu = profile.education[0];
    const bits = [edu.qualification, edu.field, edu.institution].filter(Boolean);
    if (bits.length) html += `<div class="label">Education</div><div class="value">${esc(bits.join(' — '))}</div>`;
  }
  if (profile.skills && profile.skills.length) {
    html += `<div class="label">Skills</div><div class="cv-skills">${profile.skills.map(s => '<span class="skill-tag">' + esc(s) + '</span>').join('')}</div>`;
  }
  el.innerHTML = html;
  el.style.display = html ? '' : 'none';
}

window.addEventListener('DOMContentLoaded', async () => {
  try {
    const resp = await fetch('/api/profile');
    const data = await resp.json();
    if (data.profile) {
      renderCvProfile(data.profile);
      showCvStatus('CV already uploaded', 'success');
    }
  } catch {}
  loadApplications();
});

function switchTab(name) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  if (name === 'search') {
    document.querySelector('.tab-btn:nth-child(1)').classList.add('active');
    $('tab-search').classList.add('active');
  } else {
    document.querySelector('.tab-btn:nth-child(2)').classList.add('active');
    $('tab-applications').classList.add('active');
    loadApplications();
  }
}

async function loadApplications() {
  try {
    const resp = await fetch('/api/applications');
    const data = await resp.json();
    renderApplications(data.applications, data.summary);
  } catch (err) {
    $('app-list').innerHTML = '<div class="error-msg active">Failed to load applications</div>';
  }
}

function renderApplications(apps, summary) {
  const list = $('app-list');
  const empty = $('app-empty');
  if (!apps || !apps.length) {
    list.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  let html = '';
  if (summary) {
    html += `<div class="intent-card" style="margin-bottom:16px">
      <h3>Summary</h3>
      <div class="stats">
        <span>${summary.total}</span> total &nbsp;
        ${Object.entries(summary.by_status || {}).map(([s, c]) => `<span>${c}</span> ${s}`).join(' &nbsp; ')}
      </div>
    </div>`;
  }

  html += apps.map(a => {
    const statusCls = getStatusClass(a.status);
    const canApprove = a.status === 'awaiting_approval';
    const canCancel = a.status === 'awaiting_approval' || a.status === 'needs_information';
    return `
      <div class="app-card">
        <div class="app-header">
          <div>
            <div class="app-title">${esc(a.role || 'Unknown')}</div>
            <div class="app-company">${esc(a.company || 'Unknown')}</div>
          </div>
          <span class="status-badge ${statusCls}">${esc(a.status)}</span>
        </div>
        <div class="app-meta">
          <span>${esc(a.location || 'N/A')}</span>
          <span>Match: ${a.candidate_match_score}%</span>
          <span>Priority: ${a.application_priority}%</span>
          ${a.platform ? `<span>${esc(a.platform)}</span>` : ''}
        </div>
        ${a.submitted ? `<div class="app-meta"><span>Submitted: ${esc(a.date_submitted || a.submission_time || 'N/A')}</span></div>` : ''}
        ${a.warnings && a.warnings.length ? `<div class="app-meta"><span style="color:var(--yellow)">${a.warnings.map(w => esc(w)).join('; ')}</span></div>` : ''}
        ${a.errors && a.errors.length ? `<div class="app-meta"><span style="color:var(--red)">${a.errors.map(e => esc(e)).join('; ')}</span></div>` : ''}
        ${a.missing_information && a.missing_information.length ? `<div class="app-meta"><span style="color:var(--yellow)">Needs: ${a.missing_information.map(m => esc(m.question)).join('; ')}</span></div>` : ''}
        <div class="app-actions">
          ${canApprove ? `<button class="approve-btn" onclick="approveApp('${esc(a.id)}', this)">Approve</button>` : ''}
          ${canCancel ? `<button class="cancel-btn" onclick="cancelApp('${esc(a.id)}', this)">Cancel</button>` : ''}
          <button onclick="showAppDetail('${esc(a.id)}')">View Details</button>
          ${a.url ? `<a href="${esc(a.url)}" target="_blank" style="padding:4px 12px;font-size:0.8rem;color:var(--muted)">View Job</a>` : ''}
        </div>
      </div>`;
  }).join('');

  list.innerHTML = html;
}

function getStatusClass(status) {
  const map = {
    submitted: 'status-submitted',
    pending: 'status-pending',
    awaiting_approval: 'status-awaiting',
    needs_information: 'status-needs',
    failed: 'status-failed',
    draft: 'status-draft',
    manual_action_required: 'status-manual',
    discovering: 'status-draft',
    selected: 'status-draft',
    preparing: 'status-pending',
    ready_for_review: 'status-awaiting',
    submitting: 'status-pending',
    interview: 'status-submitted',
    rejected: 'status-failed',
    withdrawn: 'status-draft',
    offer: 'status-submitted',
  };
  return map[status] || 'status-draft';
}

async function approveApp(appId, btn) {
  btn.textContent = 'Approving...';
  btn.disabled = true;
  try {
    const resp = await fetch('/api/applications/' + appId + '/approve', { method: 'POST' });
    const data = await resp.json();
    if (resp.ok && data.ok) {
      loadApplications();
    } else {
      btn.textContent = data.error || 'Failed';
      btn.disabled = false;
    }
  } catch (err) {
    btn.textContent = 'Failed';
    btn.disabled = false;
  }
}

async function cancelApp(appId, btn) {
  btn.textContent = 'Cancelling...';
  btn.disabled = true;
  try {
    const resp = await fetch('/api/applications/' + appId + '/cancel', { method: 'POST' });
    const data = await resp.json();
    if (resp.ok && data.ok) {
      loadApplications();
    } else {
      btn.textContent = data.error || 'Failed';
      btn.disabled = false;
    }
  } catch (err) {
    btn.textContent = 'Failed';
    btn.disabled = false;
  }
}

async function showAppDetail(appId) {
  const modal = $('detail-modal');
  const body = $('modal-body');
  body.innerHTML = '<div style="text-align:center;padding:20px;color:var(--muted)">Loading...</div>';
  modal.className = 'modal-overlay active';

  try {
    const resp = await fetch('/api/applications/' + appId);
    const data = await resp.json();
    if (!resp.ok || !data.application) {
      body.innerHTML = '<p style="color:var(--red)">Application not found</p>';
      return;
    }
    const a = data.application;
    let html = `<h3 style="margin-bottom:4px">${esc(a.role)}</h3>`;
    html += `<div style="color:var(--muted);margin-bottom:16px">${esc(a.company)} — ${esc(a.location)}</div>`;

    if (a.documents && a.documents.cover_letter_text) {
      html += '<div class="modal-section"><h4>Cover Letter</h4>';
      html += `<pre>${esc(a.documents.cover_letter_text)}</pre>`;
      html += '</div>';
    }

    const answerKeys = Object.keys(a.answers || {});
    if (answerKeys.length) {
      html += '<div class="modal-section"><h4>Answers</h4>';
      for (const k of answerKeys) {
        html += `<div class="modal-qa-item"><div class="modal-qa-q">${esc(k)}</div><div class="modal-qa-a">${esc(a.answers[k])}</div></div>`;
      }
      html += '</div>';
    }

    if (a.missing_information && a.missing_information.length) {
      html += '<div class="modal-section"><h4>Missing Information</h4>';
      for (const m of a.missing_information) {
        html += `<div class="modal-missing-item"><div class="modal-missing-q">${esc(m.question)}</div>`;
        if (m.category) html += `<div class="modal-missing-cat">${esc(m.category)}</div>`;
        html += '</div>';
      }
      html += '</div>';
    }

    if (a.documents) {
      html += '<div class="modal-section"><h4>Documents Status</h4>';
      html += `<div style="font-size:0.85rem">`;
      html += `<div>CV ready: ${a.documents.cv_ready ? '<span style="color:var(--green)">Yes</span>' : '<span style="color:var(--yellow)">No</span>'}</div>`;
      html += `<div>Cover letter ready: ${a.documents.cover_letter_ready ? '<span style="color:var(--green)">Yes</span>' : '<span style="color:var(--yellow)">No</span>'}</div>`;
      if (a.documents.tailored_summary) {
        html += `<div style="margin-top:8px"><strong>Tailored summary:</strong><br>${esc(a.documents.tailored_summary)}</div>`;
      }
      html += '</div></div>';
    }

    if (a.notes && a.notes.length) {
      html += '<div class="modal-section"><h4>Notes</h4>';
      html += a.notes.map(n => `<div style="font-size:0.85rem;color:var(--muted);padding:2px 0">${esc(n)}</div>`).join('');
      html += '</div>';
    }

    if (a.job_description) {
      html += '<div class="modal-section"><h4>Job Description</h4>';
      html += `<pre>${esc(a.job_description)}</pre>`;
      html += '</div>';
    }

    body.innerHTML = html;
  } catch (err) {
    body.innerHTML = '<p style="color:var(--red)">Failed to load details</p>';
  }
}

function closeModal() {
  $('detail-modal').className = 'modal-overlay';
}

function renderDetailedMatch(detailed) {
  if (!detailed || !detailed.dimensions) return '';
  let html = '<div class="app-dimensions">';
  html += detailed.dimensions.map(d => {
    const cls = d.score >= 75 ? 'dim-score-high' : d.score >= 50 ? 'dim-score-mid' : 'dim-score-low';
    return `<div class="dim-item"><span class="dim-name">${esc(d.name)}</span><span class="dim-score ${cls}">${d.score}%</span></div>`;
  }).join('');
  html += '</div>';
  return html;
}
</script>
</body>
</html>
